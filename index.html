<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LangFlash</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=Noto+Sans+JP&family=Noto+Sans+KR&family=Noto+Sans+SC&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --border: #2a2a3a;
    --accent: #7c6aff;
    --accent2: #ff6a8a;
    --text: #f0eeff;
    --muted: #6e6e8a;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Syne', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
    gap: 24px;
  }

  /* Ambient background */
  body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: -20%;
    width: 60%;
    height: 60%;
    background: radial-gradient(ellipse, rgba(124,106,255,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -20%;
    right: -10%;
    width: 50%;
    height: 50%;
    background: radial-gradient(ellipse, rgba(255,106,138,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  header {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    z-index: 1;
  }

  h1 {
    font-size: 2rem;
    font-weight: 800;
    letter-spacing: -0.03em;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .subtitle { color: var(--muted); font-size: 0.85rem; }

  /* Controls */
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
    z-index: 1;
  }

  select, button {
    font-family: 'Syne', sans-serif;
    font-size: 0.9rem;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    padding: 10px 18px;
    cursor: pointer;
    transition: all 0.2s;
    outline: none;
  }

  select:hover, button:hover { border-color: var(--accent); }

  .btn-start {
    background: linear-gradient(135deg, var(--accent), #5b4de0);
    border: none;
    font-weight: 700;
    padding: 10px 28px;
  }
  .btn-start:hover { transform: translateY(-1px); box-shadow: 0 4px 20px rgba(124,106,255,0.4); }

  /* Card area */
  .card-area {
    perspective: 1000px;
    z-index: 1;
    width: 100%;
    max-width: 380px;
  }

  .card {
    width: 100%;
    aspect-ratio: 3/2;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
  }

  .card.flipped { transform: rotateY(180deg); }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 28px;
    user-select: none;
  }

  .card-back { transform: rotateY(180deg); }

  .card-front::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 20px;
    background: linear-gradient(135deg, rgba(124,106,255,0.06), transparent);
  }

  .card-label {
    font-size: 0.7rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .card-word {
    font-size: clamp(2.5rem, 10vw, 4rem);
    font-weight: 700;
    font-family: 'Noto Sans JP', 'Noto Sans KR', 'Noto Sans SC', sans-serif;
    line-height: 1;
  }

  .card-hint { font-size: 0.8rem; color: var(--muted); }

  .card-meaning {
    font-size: 1.4rem;
    font-weight: 700;
    text-align: center;
  }

  .card-example {
    font-size: 0.8rem;
    color: var(--muted);
    text-align: center;
    line-height: 1.5;
    font-family: 'Noto Sans JP', 'Noto Sans KR', 'Noto Sans SC', sans-serif;
  }

  /* Progress */
  .progress-bar {
    width: 100%;
    max-width: 380px;
    height: 4px;
    background: var(--border);
    border-radius: 99px;
    overflow: hidden;
    z-index: 1;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    border-radius: 99px;
    transition: width 0.4s ease;
    width: 0%;
  }

  .progress-text {
    font-size: 0.8rem;
    color: var(--muted);
    z-index: 1;
  }

  /* Action buttons */
  .actions {
    display: flex;
    gap: 12px;
    z-index: 1;
  }

  .btn-no {
    background: rgba(255,106,138,0.12);
    border-color: rgba(255,106,138,0.3);
    color: var(--accent2);
    font-weight: 700;
    min-width: 100px;
  }
  .btn-no:hover { background: rgba(255,106,138,0.2); transform: translateY(-1px); }

  .btn-yes {
    background: rgba(124,106,255,0.12);
    border-color: rgba(124,106,255,0.3);
    color: var(--accent);
    font-weight: 700;
    min-width: 100px;
  }
  .btn-yes:hover { background: rgba(124,106,255,0.2); transform: translateY(-1px); }

  .btn-flip {
    background: rgba(255,255,255,0.05);
    min-width: 120px;
  }

  /* Score */
  .score {
    display: flex;
    gap: 20px;
    z-index: 1;
  }

  .score-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }

  .score-num {
    font-size: 1.4rem;
    font-weight: 800;
  }

  .score-num.good { color: var(--accent); }
  .score-num.bad { color: var(--accent2); }
  .score-label { font-size: 0.7rem; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }

  /* States */
  .empty { color: var(--muted); font-size: 0.9rem; text-align: center; z-index: 1; }

  .done-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    z-index: 1;
    text-align: center;
  }

  .done-screen.show { display: flex; }
  .done-emoji { font-size: 3rem; }
  .done-title { font-size: 1.5rem; font-weight: 800; }
  .done-sub { color: var(--muted); font-size: 0.9rem; }

  .hidden { display: none !important; }

  @keyframes pop {
    0% { transform: scale(0.95); opacity: 0; }
    100% { transform: scale(1); opacity: 1; }
  }

  .card { animation: pop 0.3s ease forwards; }
</style>
</head>
<body>

<header>
  <h1>LangFlash</h1>
  <p class="subtitle">Vocabulary flashcards</p>
</header>

<!-- Controls -->
<div class="controls" id="controls">
  <select id="langSelect">
    <option value="ko">🇰🇷 Korean</option>
    <option value="jp">🇯🇵 Japanese</option>
    <option value="cn">🇨🇳 Chinese</option>
  </select>
  <select id="levelSelect">
    <option value="1">Level 1</option>
    <option value="2">Level 2</option>
    <option value="3">Level 3</option>
    <option value="4">Level 4</option>
    <option value="5">Level 5</option>
    <option value="6">Level 6</option>
  </select>
  <button class="btn-start" onclick="startGame()">Start →</button>
</div>

<!-- Score -->
<div class="score hidden" id="score">
  <div class="score-item">
    <span class="score-num good" id="scoreGood">0</span>
    <span class="score-label">Got it</span>
  </div>
  <div class="score-item">
    <span class="score-num bad" id="scoreBad">0</span>
    <span class="score-label">Miss</span>
  </div>
</div>

<!-- Progress -->
<div class="progress-bar hidden" id="progressBar">
  <div class="progress-fill" id="progressFill"></div>
</div>
<p class="progress-text hidden" id="progressText"></p>

<!-- Card -->
<div class="card-area hidden" id="cardArea">
  <div class="card" id="card" onclick="flipCard()">
    <div class="card-face card-front">
      <span class="card-label">Tap to reveal</span>
      <span class="card-word" id="cardWord"></span>
    </div>
    <div class="card-face card-back">
      <span class="card-label">Meaning</span>
      <span class="card-meaning" id="cardMeaning"></span>
      <span class="card-example" id="cardExample"></span>
    </div>
  </div>
</div>

<!-- Actions (shown after flip) -->
<div class="actions hidden" id="actions">
  <button class="btn-no" onclick="answer(false)">✗ Miss</button>
  <button class="btn-flip" onclick="flipCard()">↩ Flip</button>
  <button class="btn-yes" onclick="answer(true)">✓ Got it</button>
</div>

<!-- Done screen -->
<div class="done-screen" id="doneScreen">
  <div class="done-emoji" id="doneEmoji"></div>
  <div class="done-title" id="doneTitle"></div>
  <div class="done-sub" id="doneSub"></div>
  <button class="btn-start" onclick="startGame()">Play Again →</button>
</div>

<p class="empty hidden" id="loadingMsg">Loading words…</p>

<script>
  const API = 'https://project-ebqun.vercel.app';
  let words = [];
  let index = 0;
  let good = 0;
  let bad = 0;
  let flipped = false;

  async function startGame() {
    const lang = document.getElementById('langSelect').value;
    const level = document.getElementById('levelSelect').value;

    show('loadingMsg');
    hide('controls'); hide('cardArea'); hide('actions');
    hide('doneScreen'); hide('score'); hide('progressBar'); hide('progressText');

    try {
      const res = await fetch(`${API}/api/words?lang=${lang}&level=${level}&limit=10`);
      const data = await res.json();
      words = data.words || [];

      if (!words.length) {
        document.getElementById('loadingMsg').textContent = 'No words found for this level.';
        show('controls');
        return;
      }

      index = 0; good = 0; bad = 0;
      hide('loadingMsg');
      show('score'); show('progressBar'); show('progressText'); show('cardArea');
      updateScore();
      showCard();
    } catch (e) {
      document.getElementById('loadingMsg').textContent = 'Failed to load. Check your connection.';
      show('controls');
    }
  }

  function showCard() {
    if (index >= words.length) { showDone(); return; }

    const w = words[index];
    document.getElementById('cardWord').textContent = w.word;
    document.getElementById('cardMeaning').textContent = w.meaning;
    document.getElementById('cardExample').textContent = w.example || '';

    const card = document.getElementById('card');
    card.classList.remove('flipped');
    flipped = false;

    hide('actions');
    show('cardArea');

    // Re-trigger animation
    card.style.animation = 'none';
    card.offsetHeight;
    card.style.animation = '';

    updateProgress();
  }

  function flipCard() {
    const card = document.getElementById('card');
    flipped = !flipped;
    card.classList.toggle('flipped', flipped);
    if (flipped) show('actions');
    else hide('actions');
  }

  function answer(correct) {
    if (correct) good++; else bad++;
    index++;
    updateScore();
    showCard();
  }

  function updateScore() {
    document.getElementById('scoreGood').textContent = good;
    document.getElementById('scoreBad').textContent = bad;
  }

  function updateProgress() {
    const pct = (index / words.length) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = `${index + 1} / ${words.length}`;
  }

  function showDone() {
    hide('cardArea'); hide('actions'); hide('progressBar'); hide('progressText');
    const pct = Math.round((good / words.length) * 100);
    const emoji = pct >= 80 ? '🔥' : pct >= 50 ? '👍' : '💪';
    const title = pct >= 80 ? 'Crushing it!' : pct >= 50 ? 'Good work!' : 'Keep going!';
    document.getElementById('doneEmoji').textContent = emoji;
    document.getElementById('doneTitle').textContent = title;
    document.getElementById('doneSub').textContent = `${good}/${words.length} correct — ${pct}%`;
    show('doneScreen');
    show('controls');
  }

  function show(id) { document.getElementById(id).classList.remove('hidden'); }
  function hide(id) { document.getElementById(id).classList.add('hidden'); }
</script>
</body>
</html>
